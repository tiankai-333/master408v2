# Master408 v2 — HTTP 引导配置（初次部署 / 本地演练用；HTTPS 就绪后切换 https.conf）
# 静态路径与后端代理对应关系：学生端 /student/、管理端 /admin/、API /api/（SSE 透传）

# 限流基线（PD-10）：通用 API 20r/s，登录/注册 3r/s；命中返回 503
limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

server {
    listen 80 default_server;
    server_name edu.wutiankai.cn;

    client_max_body_size 20m;

    # 3 Mbps 带宽下静态资源 gzip 是基线而非优化
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态前端（Vite 生产 base 分别为 /student/ 与 /admin/）
    location /student/ {
        alias /usr/share/nginx/html/student/;
        try_files $uri $uri/ /student/index.html;
    }
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = / {
        return 302 /student/;
    }

    # 登录/注册入口单独限流（爆破与垃圾注册防护，A-06 落地载体之一）
    location = /api/student/login {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /api/admin/login {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /api/student/user/register {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # 其余 API：SSE 透传要求关闭缓冲（tech-stack 流式契约）
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
