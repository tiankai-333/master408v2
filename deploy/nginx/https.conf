# Master408 v2 — HTTPS 最终配置（第 3 组证书签发后启用）
# 启用方式：compose 中挂载本文件覆盖镜像内置 http.conf，并挂载 ./ssl 证书目录
# 证书路径按 Let's Encrypt live 目录结构存放：./ssl/live/edu.wutiankai.cn/{fullchain,privkey}.pem

limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

# ACME HTTP-01 验证 + 全站跳转
server {
    listen 80 default_server;
    server_name edu.wutiankai.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edu.wutiankai.cn;

    ssl_certificate     /etc/nginx/ssl/live/edu.wutiankai.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/edu.wutiankai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=15552000" always;

    location /student/ {
        alias /usr/share/nginx/html/student/;
        try_files $uri $uri/ /student/index.html;
    }
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = / {
        return 302 /student/;
    }

    location = /api/student/login {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /api/admin/login {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /api/student/user/register {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # 小程序匿名端点（specs/2026-09-30-wx-domain-update WX-04）：与 web 登录同限流档；
    # unBind 需 token，不列入
    location = /api/wx/student/auth/bind {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /api/wx/student/auth/checkBind {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /api/wx/student/user/register {
        limit_req zone=auth burst=6 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
